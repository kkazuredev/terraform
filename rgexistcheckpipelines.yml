trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'devops-sub'
  resourceGroupName: 'rgtf2-eus2'
  location: 'eastus2'

steps:
  - task: AzureCLI@2
    displayName: 'check/create RG'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "checking RG: $(resourceGroupName)"

        RG_EXISTS=$(az group exists --name "$(resourceGroupName)")

        if [ "$RG_EXISTS" = "true" ]; then
          echo "RG already exists."
          echo "using existing RG group: $(resourceGroupName)"
        else
          echo "RG doesn't exist"
          echo "creating RG: $(resourceGroupName)"

          az group create \
            --name "$(resourceGroupName)" \
            --location "$(location)"

          echo "created RG successfully"
        fi

  - task: AzureCLI@2
    displayName: 'verify RG'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "RG details"

        az group show \
          --name "$(resourceGroupName)" \
          --output table