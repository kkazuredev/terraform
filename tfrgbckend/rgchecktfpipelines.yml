trigger: none

parameters:
  - name: azureServiceConnection
    type: string
    default: 'devops-sub'
  - name: resourceGroupName
    type: string
    default: 'rgtf2-eus2'
  - name: terraformDirectory
    type: string
    default: 'tfrgbackend'
  - name: environment
    type: string
    default: 'dev'
    values:
      - dev
      - QA
      - prod

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'devops-sub'
  resourceGroupName: 'rgtf2-eus2'
  terraformDirectory: 'tfrgbackend'


steps:


  - task: TerraformInstaller@1
    displayName: 'Terraform Installer'
    inputs:
      terraformVersion: 'latest'

  - task: AzureCLI@2
    displayName: 'Terraform Init & check RG'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: '$(terraformDirectory)'
      inlineScript: |

        terraform init
        
        echo "checking RG: $(resourceGroupName)"

        EXISTS=$(az group exists \
        --name "$(resourceGroupName)")

        if [ "$EXISTS" = "true" ]; then

          echo "RG already exists."
          
          RG_ID=$(az group show \
          --name "$(resourceGroupName)" \
          --query id \
          -o tsv)

          echo "importing existing RG group into Terraform statefile"
          terraform import \
          azurerm_resource_group.rg \
          "$RG_ID" || echo "imported RG successfully"

        else
          
          echo "RG doesn't exist"
          echo "terraform creating RG"
        
        fi

  - task: AzureCLI@2
    displayName: 'Terraform Plan'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: '$(terraformDirectory)'
      inlineScript: |
        terraform plan -out=tfplan


  - task: AzureCLI@2
    displayName: 'Terraform apply'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: '$(terraformDirectory)'
      inlineScript: |
        terraform apply -auto-approve tfplan
